<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - Politics Manager</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/7.3.2/mdb.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">
    <div class="container vh-100 d-flex align-items-center justify-content-center">
        <div class="card shadow-3" style="width: 26rem;">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <i class="fas fa-landmark fa-3x text-primary mb-3"></i>
                    <h3 class="fw-bold">Politics Manager</h3>
                    <p class="text-muted">Sign in to your account</p>
                </div>

                <div th:if="${param.error}" class="alert alert-danger py-2">
                    <i class="fas fa-exclamation-circle me-2"></i>Invalid username or password
                </div>
                <div th:if="${param.logout}" class="alert alert-success py-2">
                    <i class="fas fa-check-circle me-2"></i>You have been logged out
                </div>

                <form method="post" action="/login">
                    <div data-mdb-input-init class="form-outline mb-4">
                        <input type="email" name="username" id="username" class="form-control" required>
                        <label class="form-label" for="username">Email</label>
                    </div>

                    <div data-mdb-input-init class="form-outline mb-4">
                        <input type="password" name="password" id="password" class="form-control" required>
                        <label class="form-label" for="password">Password</label>
                    </div>

                    <button type="submit" class="btn btn-primary btn-block w-100 mb-3">
                        <i class="fas fa-sign-in-alt me-2"></i>Sign In
                    </button>

                    <div class="text-center text-muted small">
                        Default: admin@party.com / admin
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/7.3.2/mdb.min.js"></script>
</body>
</html>
