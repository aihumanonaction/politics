<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:if="${party.id == null}">New Party - Politics Manager</title>
    <title th:unless="${party.id == null}">Edit Party - Politics Manager</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/7.3.2/mdb.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-2">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">
            <i class="fas fa-landmark me-2"></i>Politics Manager
        </a>
        <button class="navbar-toggler" type="button" data-mdb-toggle="collapse" data-mdb-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                <li class="nav-item"><a class="nav-link active" href="/parties"><i class="fas fa-building me-1"></i>Parties</a></li>
                <li class="nav-item"><a class="nav-link" href="/members"><i class="fas fa-users me-1"></i>Members</a></li>
                <li class="nav-item"><a class="nav-link" href="/countries"><i class="fas fa-globe me-1"></i>Countries</a></li>
                <li class="nav-item"><a class="nav-link" href="/regions"><i class="fas fa-map-marked-alt me-1"></i>Regions</a></li>
                <li class="nav-item"><a class="nav-link" href="/nomination-costs"><i class="fas fa-coins me-1"></i>Costs</a></li>
                <li class="nav-item">
                    <form method="post" action="/logout" class="d-inline">
                        <button type="submit" class="nav-link btn btn-link text-white" style="text-decoration:none">
                            <i class="fas fa-sign-out-alt me-1"></i>Logout
                        </button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container my-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-2">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0" th:if="${party.id == null}">
                        <i class="fas fa-plus-circle me-2"></i>New Political Party
                    </h5>
                    <h5 class="mb-0" th:unless="${party.id == null}">
                        <i class="fas fa-edit me-2"></i>Edit Party
                    </h5>
                </div>
                <div class="card-body p-4">
                    <form th:action="${party.id == null} ? '/parties' : @{/parties/{id}/edit(id=${party.id})}"
                          method="post">

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <div data-mdb-input-init class="form-outline">
                                    <input type="text" name="name" id="name" class="form-control"
                                           th:value="${party.name}" required>
                                    <label class="form-label" for="name">Party Name</label>
                                </div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <div data-mdb-input-init class="form-outline">
                                    <input type="text" name="ideology" id="ideology" class="form-control"
                                           th:value="${party.ideology}">
                                    <label class="form-label" for="ideology">Ideology</label>
                                </div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <div data-mdb-input-init class="form-outline">
                                    <input type="date" name="foundedDate" id="foundedDate" class="form-control"
                                           th:value="${party.foundedDate}">
                                    <label class="form-label" for="foundedDate">Founded Date</label>
                                </div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <div data-mdb-input-init class="form-outline">
                                    <input type="text" name="headquarters" id="headquarters" class="form-control"
                                           th:value="${party.headquarters}">
                                    <label class="form-label" for="headquarters">Headquarters</label>
                                </div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <div data-mdb-input-init class="form-outline">
                                <input type="url" name="logoUrl" id="logoUrl" class="form-control"
                                       th:value="${party.logoUrl}">
                                <label class="form-label" for="logoUrl">Logo URL</label>
                            </div>
                        </div>

                        <div class="mb-4">
                            <div data-mdb-input-init class="form-outline">
                                <textarea name="description" id="description" class="form-control" rows="3"
                                          th:text="${party.description}"></textarea>
                                <label class="form-label" for="description">Description</label>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold">Regions</label>
                            <div th:each="c : ${allCountries}" class="mb-2">
                                <div class="fw-medium text-primary small mb-1">
                                    <i class="fas fa-globe me-1"></i><span th:text="${c.name}">Country</span>
                                </div>
                                <div class="row row-cols-2 row-cols-md-3 g-1">
                                    <div th:each="r : ${allRegions}"
                                         th:if="${r.country.id == c.id}"
                                         class="col">
                                        <div class="form-check">
                                            <input type="checkbox" name="regionIds"
                                                   th:value="${r.id}" class="form-check-input"
                                                   th:id="'region-' + ${r.id}"
                                                   th:checked="${party.regions?.contains(r)}">
                                            <label class="form-check-label" th:for="'region-' + ${r.id}">
                                                <span th:text="${r.parent?.name != null} ? r.parent.name + ' > ' + r.name : r.name"></span>
                                                <span class="text-muted small" th:text="'(' + ${r.type} + ')'"></span>
                                            </label>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a href="/parties" class="btn btn-secondary">
                                <i class="fas fa-arrow-left me-1"></i>Cancel
                            </a>
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save me-1"></i>
                                <span th:if="${party.id == null}">Create Party</span>
                                <span th:unless="${party.id == null}">Update Party</span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/7.3.2/mdb.min.js"></script>
</body>
</html>
