<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Parties - Politics Manager</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/7.3.2/mdb.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-2">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">
            <i class="fas fa-landmark me-2"></i>Politics Manager
        </a>
        <button class="navbar-toggler" type="button" data-mdb-toggle="collapse" data-mdb-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                <li class="nav-item"><a class="nav-link active" href="/parties"><i class="fas fa-building me-1"></i>Parties</a></li>
                <li class="nav-item"><a class="nav-link" href="/members"><i class="fas fa-users me-1"></i>Members</a></li>
                <li class="nav-item"><a class="nav-link" href="/countries"><i class="fas fa-globe me-1"></i>Countries</a></li>
                <li class="nav-item"><a class="nav-link" href="/regions"><i class="fas fa-map-marked-alt me-1"></i>Regions</a></li>
                <li class="nav-item"><a class="nav-link" href="/nomination-costs"><i class="fas fa-coins me-1"></i>Costs</a></li>
                <li class="nav-item">
                    <form method="post" action="/logout" class="d-inline">
                        <button type="submit" class="nav-link btn btn-link text-white" style="text-decoration:none">
                            <i class="fas fa-sign-out-alt me-1"></i>Logout
                        </button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container my-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="fw-bold mb-0"><i class="fas fa-building me-2 text-primary"></i>Political Parties</h4>
        <a href="/parties/new" class="btn btn-primary">
            <i class="fas fa-plus me-1"></i>Add Party
        </a>
    </div>

    <div class="card shadow-2">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>Name</th>
                            <th>Ideology</th>
                            <th>Founded</th>
                            <th>Headquarters</th>
                            <th>Regions</th>
                            <th class="text-center">Members</th>
                            <th class="text-center">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="party : ${parties}">
                            <td class="fw-bold" th:text="${party.name}">Party Name</td>
                            <td><span class="badge bg-info rounded-pill" th:text="${party.ideology}">Ideology</span></td>
                            <td th:text="${party.foundedDate}">2024-01-01</td>
                            <td th:text="${party.headquarters}">City</td>
                            <td>
                                <span th:each="r, iter : ${party.regions}"
                                      class="badge bg-info rounded-pill me-1 mb-1"
                                      th:text="${r.name}">
                                </span>
                                <span th:if="${#sets.isEmpty(party.regions)}" class="text-muted small">—</span>
                            </td>
                            <td class="text-center">
                                <span class="badge bg-secondary rounded-pill" th:text="${party.members.size()}">0</span>
                            </td>
                            <td class="text-center">
                                <a th:href="@{/parties/{id}/edit(id=${party.id})}" class="btn btn-sm btn-warning me-1">
                                    <i class="fas fa-edit"></i>
                                </a>
                                <a th:href="@{/members(partyId=${party.id})}" class="btn btn-sm btn-info me-1 text-white">
                                    <i class="fas fa-users"></i>
                                </a>
                                <form th:action="@{/parties/{id}/delete(id=${party.id})}" method="post" style="display:inline"
                                      onsubmit="return confirm('Delete this party?')">
                                    <button type="submit" class="btn btn-sm btn-danger">
                                        <i class="fas fa-trash"></i>
                                    </button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(parties)}">
                            <td colspan="7" class="text-center text-muted py-4">
                                <i class="fas fa-inbox fa-2x d-block mb-2"></i>No parties found
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/7.3.2/mdb.min.js"></script>
</body>
</html>
