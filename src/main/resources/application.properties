spring.application.name=politics
server.port=8080

# H2 Database (in-memory for development)
spring.datasource.url=jdbc:h2:mem:politicsdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# Liquibase
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.enabled=true

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Jackson date format
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.serialization.write-dates-as-timestamps=false

# Default admin credentials (seeded on first startup)
app.admin.first-name=Admin
app.admin.last-name=User
app.admin.email=admin@party.com
app.admin.password=admin
app.admin.role=Administrator
